name: Build Notepad Notes Todo APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Notepad Notes Todo APK
    runs-on: ubuntu-latest

    steps:
      - name: 01 - Checkout repository
        uses: actions/checkout@v4

      - name: 02 - Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: 03 - Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 04 - Install Android SDK 34
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 05 - Create project directories
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/notepad/notes/todo
          mkdir -p app/src/main/res/values

      - name: 06 - Write gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

      - name: 07 - Write settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NotepadNotesTodo"
          include(":app")
          EOF

      - name: 08 - Write root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      - name: 09 - Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: 10 - Write app/build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.notepad.notes.todo"
              compileSdk 34
              defaultConfig {
                  applicationId "com.notepad.notes.todo"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
          }
          EOF

      - name: 11 - Write strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Notepad: Notes, Todo</string>
          </resources>
          EOF

      - name: 12 - Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 13 - Write MainActivity.kt (Complete App & 50MB Database Logic)
        run: |
          cat > app/src/main/java/com/notepad/notes/todo/MainActivity.kt <<'EOF'
          package com.notepad.notes.todo

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class NoteItem(
              val id: Long,
              val title: String,
              val content: String,
              val category: String,
              val createdAt: String,
              val sizeBytes: Long
          )

          class DatabaseHelper(context: Context) : SQLiteOpenHelper(context, DATABASE_NAME, null, DATABASE_VERSION) {
              companion object {
                  private const val DATABASE_NAME = "notepad_app.db"
                  private const val DATABASE_VERSION = 1
                  const val TABLE_NOTES = "notes"
                  const val COLUMN_ID = "id"
                  const val COLUMN_TITLE = "title"
                  const val COLUMN_CONTENT = "content"
                  const val COLUMN_CATEGORY = "category"
                  const val COLUMN_CREATED_AT = "created_at"
                  const val COLUMN_SIZE_BYTES = "size_bytes"
                  
                  const val MAX_STORAGE_BYTES = 50 * 1024 * 1024L // 50 MB Storage Limit
              }

              override fun onCreate(db: SQLiteDatabase) {
                  val createTableQuery = """
                      CREATE TABLE $TABLE_NOTES (
                          $COLUMN_ID INTEGER PRIMARY KEY AUTOINCREMENT,
                          $COLUMN_TITLE TEXT,
                          $COLUMN_CONTENT TEXT,
                          $COLUMN_CATEGORY TEXT,
                          $COLUMN_CREATED_AT TEXT,
                          $COLUMN_SIZE_BYTES INTEGER
                      )
                  """.trimIndent()
                  db.execSQL(createTableQuery)
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  db.execSQL("DROP TABLE IF EXISTS $TABLE_NOTES")
                  onCreate(db)
              }

              fun getTotalUsedBytes(): Long {
                  val db = this.readableDatabase
                  val cursor = db.rawQuery("SELECT SUM($COLUMN_SIZE_BYTES) FROM $TABLE_NOTES", null)
                  var total: Long = 0
                  if (cursor.moveToFirst()) {
                      total = cursor.getLong(0)
                  }
                  cursor.close()
                  return total
              }

              fun insertNote(title: String, content: String, category: String): Boolean {
                  val titleBytes = title.toByteArray(Charsets.UTF_8).size.toLong()
                  val contentBytes = content.toByteArray(Charsets.UTF_8).size.toLong()
                  val noteSizeBytes = titleBytes + contentBytes

                  val currentUsedBytes = getTotalUsedBytes()
                  if (currentUsedBytes + noteSizeBytes > MAX_STORAGE_BYTES) {
                      return false // Block Write (50 MB Limit Reached)
                  }

                  val db = this.writableDatabase
                  val dateStr = SimpleDateFormat("dd MMM yyyy, hh:mm a", Locale.getDefault()).format(Date())
                  
                  val values = ContentValues().apply {
                      put(COLUMN_TITLE, title)
                      put(COLUMN_CONTENT, content)
                      put(COLUMN_CATEGORY, category)
                      put(COLUMN_CREATED_AT, dateStr)
                      put(COLUMN_SIZE_BYTES, noteSizeBytes)
                  }

                  db.insert(TABLE_NOTES, null, values)
                  return true
              }

              fun getAllNotes(): List<NoteItem> {
                  val notesList = mutableListOf<NoteItem>()
                  val db = this.readableDatabase
                  val cursor = db.rawQuery("SELECT * FROM $TABLE_NOTES ORDER BY $COLUMN_ID DESC", null)

                  if (cursor.moveToFirst()) {
                      do {
                          val id = cursor.getLong(cursor.getColumnIndexOrThrow(COLUMN_ID))
                          val title = cursor.getString(cursor.getColumnIndexOrThrow(COLUMN_TITLE))
                          val content = cursor.getString(cursor.getColumnIndexOrThrow(COLUMN_CONTENT))
                          val category = cursor.getString(cursor.getColumnIndexOrThrow(COLUMN_CATEGORY))
                          val createdAt = cursor.getString(cursor.getColumnIndexOrThrow(COLUMN_CREATED_AT))
                          val sizeBytes = cursor.getLong(cursor.getColumnIndexOrThrow(COLUMN_SIZE_BYTES))

                          notesList.add(NoteItem(id, title, content, category, createdAt, sizeBytes))
                      } while (cursor.moveToNext())
                  }
                  cursor.close()
                  return notesList
              }

              fun deleteNote(id: Long): Boolean {
                  val db = this.writableDatabase
                  val result = db.delete(TABLE_NOTES, "$COLUMN_ID=?", arrayOf(id.toString()))
                  return result > 0
              }
          }

          class MainActivity : AppCompatActivity() {

              private lateinit var dbHelper: DatabaseHelper
              private lateinit var progressBar: ProgressBar
              private lateinit var tvStorageUsage: TextView
              private lateinit var notesContainer: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  dbHelper = DatabaseHelper(this)

                  val mainLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F8FAFC"))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  // Top Header
                  val headerBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(40, 40, 40, 20)
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val tvTitle = TextView(this).apply {
                      text = "Notepad: Notes, Todo"
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#0F172A"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  headerBar.addView(tvTitle)

                  // 50 MB Storage Card
                  val memoryCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(35, 30, 35, 30)
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 24f
                      }
                      elevation = 6f
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(40, 10, 40, 20) }
                  }

                  tvStorageUsage = TextView(this).apply {
                      textSize = 14f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#334155"))
                  }

                  progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 20
                      ).apply { setMargins(0, 15, 0, 0) }
                  }

                  memoryCard.addView(tvStorageUsage)
                  memoryCard.addView(progressBar)

                  // Notes List ScrollView
                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f
                      )
                      isFillViewport = true
                  }

                  notesContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 10, 40, 40)
                  }
                  scrollView.addView(notesContainer)

                  // Add Button
                  val btnAdd = Button(this).apply {
                      text = "+ Add New Note"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#0F172A"))
                          cornerRadius = 30f
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(40, 10, 40, 30) }

                      setOnClickListener { showAddNoteDialog() }
                  }

                  mainLayout.addView(headerBar)
                  mainLayout.addView(memoryCard)
                  mainLayout.addView(scrollView)
                  mainLayout.addView(btnAdd)

                  setContentView(mainLayout)
                  refreshNotesAndStorage()
              }

              private fun refreshNotesAndStorage() {
                  val totalBytes = dbHelper.getTotalUsedBytes()
                  val totalMB = totalBytes.toDouble() / (1024 * 1024)
                  val percent = ((totalBytes.toDouble() / DatabaseHelper.MAX_STORAGE_BYTES) * 100).toInt()

                  val formattedMB = String.format("%.2f", totalMB)
                  tvStorageUsage.text = "Memory: $formattedMB MB / 50.00 MB ($percent%)"
                  progressBar.progress = percent

                  notesContainer.removeAllViews()
                  val notes = dbHelper.getAllNotes()

                  if (notes.isEmpty()) {
                      val emptyTv = TextView(this).apply {
                          text = "कोई नोट उपलब्ध नहीं है। नया जोड़ने के लिए बटन दबाएं।"
                          textSize = 14f
                          setTextColor(Color.GRAY)
                          gravity = Gravity.CENTER
                          setPadding(0, 50, 0, 0)
                      }
                      notesContainer.addView(emptyTv)
                  } else {
                      for (note in notes) {
                          notesContainer.addView(createNoteCard(note))
                      }
                  }
              }

              private fun createNoteCard(note: NoteItem): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(35, 30, 35, 30)
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 20f
                      }
                      elevation = 4f
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 0, 0, 20) }
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  val tvTitle = TextView(this).apply {
                      text = note.title
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#1E293B"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val btnDelete = TextView(this).apply {
                      text = "🗑️"
                      textSize = 16f
                      setPadding(10, 0, 10, 0)
                      setOnClickListener {
                          dbHelper.deleteNote(note.id)
                          Toast.makeText(this@MainActivity, "नोट डिलीट कर दिया गया", Toast.LENGTH_SHORT).show()
                          refreshNotesAndStorage()
                      }
                  }

                  header.addView(tvTitle)
                  header.addView(btnDelete)

                  val tvContent = TextView(this).apply {
                      text = note.content
                      textSize = 14f
                      setTextColor(Color.parseColor("#475569"))
                      setPadding(0, 10, 0, 15)
                  }

                  val sizeKB = String.format("%.2f", note.sizeBytes.toDouble() / 1024)
                  val tvFooter = TextView(this).apply {
                      text = "${note.createdAt}  •  $sizeKB KB"
                      textSize = 11f
                      setTextColor(Color.GRAY)
                  }

                  card.addView(header)
                  card.addView(tvContent)
                  card.addView(tvFooter)

                  return card
              }

              private fun showAddNoteDialog() {
                  val builder = AlertDialog.Builder(this)
                  builder.setTitle("नया नोटिस / नोट लिखें")

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 20, 40, 20)
                  }

                  val etTitle = EditText(this).apply { hint = "शीर्षक (Title)" }
                  val etContent = EditText(this).apply { hint = "विवरण लिखें..."; minLines = 4 }

                  layout.addView(etTitle)
                  layout.addView(etContent)
                  builder.setView(layout)

                  builder.setPositiveButton("सेव करें") { dialog, _ ->
                      val title = etTitle.text.toString().trim()
                      val content = etContent.text.toString().trim()

                      if (title.isNotEmpty() || content.isNotEmpty()) {
                          val success = dbHelper.insertNote(title, content, "General")
                          if (!success) {
                              showMemoryFullAlert()
                          } else {
                              refreshNotesAndStorage()
                          }
                      }
                      dialog.dismiss()
                  }

                  builder.setNegativeButton("रद्द करें") { dialog, _ -> dialog.dismiss() }
                  builder.show()
              }

              private fun showMemoryFullAlert() {
                  AlertDialog.Builder(this)
                      .setTitle("⚠️ Memory Full (50 MB Limit)")
                      .setMessage("50 MB की स्टोरेज सीमा पूरी हो चुकी है! नया नोट जोड़ने के लिए पुराना नोट डिलीट करें।")
                      .setPositiveButton("ठीक है", null)
                      .show()
              }
          }
          EOF

      - name: 14 - Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 15 - Upload Notepad App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notepad-Notes-Todo-APK
          path: app/build/outputs/apk/debug/app-debug.apk

