name: Build Zeeshan Notice App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Step-by-Step Android Build Pipeline
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # STEP 1: GitHub Repository & Environment Setup
      # ==========================================
      - name: "Robot Step 01: Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Robot Step 02: Setup Java OpenJDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "Robot Step 03: Initialize Android SDK Components"
        run: |
          set -euo pipefail
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # ==========================================
      # STEP 2: Modular Directory Creation
      # ==========================================
      - name: "Robot Step 04: Create Root & Source Directories"
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/notice

      - name: "Robot Step 05: Create Resource & Asset Directories"
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/layout

      # ==========================================
      # STEP 3: System Gradle Configuration
      # ==========================================
      - name: "Robot Step 06: Configure Gradle Performance Properties"
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

      - name: "Robot Step 07: Configure Settings Gradle Project Tree"
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanNotice"
          include(":app")
          EOF

      - name: "Robot Step 08: Configure Root Build Script"
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      - name: "Robot Step 09: Download & Link Gradle Wrapper"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: "Robot Step 10: Configure Module App build.gradle"
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.zeeshan.notice"
              compileSdk 34

              defaultConfig {
                  applicationId "com.zeeshan.notice"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
          }
          EOF

      # ==========================================
      # STEP 4: UI Design, Theme & Resources
      # ==========================================
      - name: "Robot Step 11: Create App Strings Configuration"
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Z Notice</string>
              <string name="dashboard_title">Zeeshan Notice</string>
          </resources>
          EOF

      - name: "Robot Step 12: Create VIP Chocolate Theme Color Palette"
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="chocolate_dark">#2B170C</color>
              <color name="chocolate_main">#3D2314</color>
              <color name="chocolate_light">#5A3822</color>
              <color name="white">#FFFFFF</color>
              <color name="bg_cream">#FDFBF7</color>
              <color name="text_dark">#1C100A</color>
              <color name="gold_accent">#D4AF37</color>
          </resources>
          EOF

      # ==========================================
      # STEP 5: Icons & Branding Generation
      # ==========================================
      - name: "Robot Step 13: Generate 3D Icon Background Asset"
        run: |
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#5A3822"/>
                          <item android:offset="1.0" android:color="#2B170C"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

      - name: "Robot Step 14: Generate 3D White Z Foreground Vector"
        run: |
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1C100A"
                  android:pathData="M28,28 L80,28 L80,42 L48,68 L80,68 L80,82 L28,82 L28,68 L60,42 L28,42 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M25,25 L77,25 L77,39 L45,65 L77,65 L77,79 L25,79 L25,65 L57,39 L25,39 Z" />
          </vector>
          EOF

      - name: "Robot Step 15: Create Adaptive Icon Configuration"
        run: |
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

      # ==========================================
      # STEP 6: Core App Manifest & Logic
      # ==========================================
      - name: "Robot Step 16: Write AndroidManifest.xml Architecture"
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

      - name: "Robot Step 17: Write MainActivity.kt Logic Code"
        run: |
          cat > app/src/main/java/com/zeeshan/notice/MainActivity.kt <<'EOF'
          package com.zeeshan.notice

          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var mainContainer: LinearLayout
              private lateinit var dashboardHeader: LinearLayout
              private lateinit var projectHeader: LinearLayout
              private lateinit var projectTitleTv: TextView
              private lateinit var editorLayout: LinearLayout
              private lateinit var noticeListLayout: LinearLayout
              private lateinit var noteEditText: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  mainContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#FDFBF7"))
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }

                  dashboardHeader = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(40, 45, 40, 45)
                      setBackgroundColor(Color.parseColor("#3D2314"))
                      elevation = 14f
                  }

                  val menuBtn = TextView(this).apply {
                      text = "≡"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 30, 0)
                      setOnClickListener { showSideDrawer() }
                  }

                  val titleTv = TextView(this).apply {
                      text = "Zeeshan Notice"
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  val memoryTv = TextView(this).apply {
                      text = "💾 12.5/50MB"
                      textSize = 13f
                      setTextColor(Color.parseColor("#D4AF37"))
                      setTypeface(null, Typeface.BOLD)
                  }

                  dashboardHeader.addView(menuBtn)
                  dashboardHeader.addView(titleTv)
                  dashboardHeader.addView(memoryTv)

                  projectHeader = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(30, 35, 30, 35)
                      setBackgroundColor(Color.parseColor("#3D2314"))
                      visibility = View.GONE
                      elevation = 14f
                  }

                  val backBtn = TextView(this).apply {
                      text = "←"
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 25, 0)
                      setOnClickListener { closeEditor() }
                  }

                  projectTitleTv = TextView(this).apply {
                      text = "Project Alpha"
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  val saveBtn = TextView(this).apply {
                      text = "✔ SAVE"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#D4AF37"))
                      setOnClickListener {
                          Toast.makeText(this@MainActivity, "नोट सुरक्षित कर दिया गया!", Toast.LENGTH_SHORT).show()
                          closeEditor()
                      }
                  }

                  projectHeader.addView(backBtn)
                  projectHeader.addView(projectTitleTv)
                  projectHeader.addView(saveBtn)

                  noticeListLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  }

                  addNoticeCard("🔒 Project Alpha", "आज की मीटिंग के मुख्य बिंदु और प्रोजेक्ट का काम...", "#3D2314")
                  addNoticeCard("Personal Diary", "घरेलू सामान की लिस्ट और बही-खाता एंट्री...", "#5A3822")

                  editorLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.WHITE)
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(-1, -1, 1f)
                  }

                  val paperBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(20, 15, 20, 15)
                      setBackgroundColor(Color.parseColor("#F5EFE6"))
                  }
                  
                  val papers = listOf("📄 Plain", "📊 Margin", "📝 Ruled", "📐 Grid 90°")
                  for (p in papers) {
                      val btn = Button(this).apply {
                          text = p
                          textSize = 11f
                          setTextColor(Color.parseColor("#3D2314"))
                          background = GradientDrawable().apply {
                              setColor(Color.WHITE)
                              cornerRadius = 15f
                          }
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(5, 0, 5, 0) }
                      }
                      paperBar.addView(btn)
                  }

                  noteEditText = EditText(this).apply {
                      hint = "यहाँ अपना नोटिस लिखें..."
                      textSize = 16f
                      setPadding(40, 40, 40, 40)
                      gravity = Gravity.TOP
                      setBackgroundColor(Color.TRANSPARENT)
                      layoutParams = LinearLayout.LayoutParams(-1, -1)
                  }

                  editorLayout.addView(paperBar)
                  editorLayout.addView(noteEditText)

                  val fabLayout = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, -2)
                  }
                  val fabBtn = Button(this).apply {
                      text = "+"
                      textSize = 30f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#3D2314"))
                      }
                      layoutParams = FrameLayout.LayoutParams(130, 130).apply {
                          gravity = Gravity.END or Gravity.BOTTOM
                          setMargins(0, 0, 40, 40)
                      }
                      setOnClickListener { openEditor("नया प्रोजेक्ट") }
                  }
                  fabLayout.addView(fabBtn)

                  mainContainer.addView(dashboardHeader)
                  mainContainer.addView(projectHeader)
                  mainContainer.addView(noticeListLayout)
                  mainContainer.addView(editorLayout)
                  mainContainer.addView(fabLayout)

                  setContentView(mainContainer)
              }

              private fun addNoticeCard(title: String, preview: String, headerColorHex: String) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      elevation = 8f
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 24f
                      }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply {
                          setMargins(0, 0, 0, 30)
                      }
                      setOnClickListener { openEditor(title) }
                  }

                  val cardHeader = TextView(this).apply {
                      text = title
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(30, 20, 30, 20)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(headerColorHex))
                          cornerRadii = floatArrayOf(24f, 24f, 24f, 24f, 0f, 0f, 0f, 0f)
                      }
                  }

                  val cardBody = TextView(this).apply {
                      text = preview
                      textSize = 14f
                      setTextColor(Color.parseColor("#333333"))
                      setPadding(30, 25, 30, 25)
                  }

                  card.addView(cardHeader)
                  card.addView(cardBody)
                  noticeListLayout.addView(card)
              }

              private fun openEditor(title: String) {
                  dashboardHeader.visibility = View.GONE
                  noticeListLayout.visibility = View.GONE
                  projectHeader.visibility = View.VISIBLE
                  editorLayout.visibility = View.VISIBLE
                  projectTitleTv.text = title
              }

              private fun closeEditor() {
                  projectHeader.visibility = View.GONE
                  editorLayout.visibility = View.GONE
                  dashboardHeader.visibility = View.VISIBLE
                  noticeListLayout.visibility = View.VISIBLE
              }

              private fun showSideDrawer() {
                  val popup = PopupMenu(this, dashboardHeader)
                  popup.menu.add("📊 1. Memory Details (50 MB Limit)")
                  popup.menu.add("🔐 2. App Lock Manager")
                  popup.menu.add("📁 3. Folder Lock Setup")

                  popup.setOnMenuItemClickListener { item ->
                      Toast.makeText(this, item.title, Toast.LENGTH_SHORT).show()
                      true
                  }
                  popup.show()
              }
          }
          EOF

      # ==========================================
      # STEP 7: Compilation & Output Generation
      # ==========================================
      - name: "Robot Step 18: Execute Gradle Assemble Debug APK"
        run: gradle :app:assembleDebug --no-daemon

      - name: "Robot Step 19: Upload Generated APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-Notice-APK
          path: app/build/outputs/apk/debug/app-debug.apk

